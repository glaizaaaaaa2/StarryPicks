services:
  - type: web
    name: starrypicks
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: starrypicks-db
          property: connectionString

databases:
  - name: starrypicks-db
    databaseName: starrypicks
    user: starrypicks
    plan: free
