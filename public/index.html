<style>

header{text-align:center;padding:36px 0 28px}
.logo{font-family:'Pacifico',cursive,serif;font-size:clamp(2.2rem,8vw,3.6rem);color:var(--star);-webkit-text-stroke:2px #1a0b3b;paint-order:stroke fill;text-shadow:0 0 22px rgba(255,216,77,.45);margin:0}

.search{width:min(320px,100%)}

.back{margin:0 0 16px}

.denom-price{font-size:1.2rem;font-weight:600;color:var(--star);white-space:nowrap}
.denomination .acts{margin:8px 0 0}
.cat{font-size:.75rem;color:var(--lilac);letter-spacing:.06em;text-transform:uppercase}
.name{font-size:1.1rem;font-weight:600}
.note{color:var(--mut);font-size:.9rem;min-height:1.2em}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
.price{font-size:1.45rem;font-weight:600;color:var(--star)}
.badge{font-size:.78rem;padding:4px 11px;border-radius:999px;border:1px solid}

.btn:hover{border-color:var(--star)}

.btn.del{color:var(--no)}
.empty{text-align:center;color:var(--mut);padding:50px 0}
.adminbtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:rgba(40,16,90,.85);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:14px;backdrop-filter:blur(8px)}

.box{background:#2a1260;border:1px solid var(--line);border-radius:22px;padding:20px;width:min(420px,100%);max-height:90vh;overflow:auto}
.box h3{margin:0 0 12px;font-weight:600}
.f{margin-bottom:10px}.f label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}

.chk{display:flex;align-items:center;gap:8px;margin:6px 0 14px}

<canvas id="sky"></canvas>
<div id="root"></div>
<script>
const S = {shop:{name:'StarryPicks',by:'by Elora',tagline:''}, products:[], categories:[], cat:'All', q:'', admin:false, modal:null, login:false, loading:true, loadError:'', err:''};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso = n => '₱' + Number(n).toLocaleString('en-PH',{maximumFractionDigits:2});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}
async function api(method,url,b){
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&url!=='/api/login'){S.admin=false;render();throw new Error('Please log in again')}
  if(!r.ok) throw new Error(j.error||'Something went wrong');
  return j;
}
function setData(d){S.shop=d.shop;S.products=d.products;S.categories=d.categories||[];render()}

function render(){
  const cats = ['All', ...new Set([...S.categories,...S.products.map(p=>p.category).filter(Boolean)])];
  if(!cats.includes(S.cat)) S.cat='All';
  const q = S.q.trim().toLowerCase();
  const list = S.products.filter(p=>
    (S.cat==='All'||p.category===S.cat) &&
    (!q||(p.name+' '+p.category+' '+p.denominations.map(d=>d.name+' '+d.note).join(' ')).toLowerCase().includes(q))
  );
  const detailId = location.pathname==='/product' ? new URLSearchParams(location.search).get('id') : null;
  const selected = detailId ? S.products.find(p=>p.id===detailId) : null;
  if(detailId&&!selected&&!S.loading&&!S.loadError) history.replaceState({},'','/');
  const denominations = selected ? selected.denominations : [];
  let h = '<div class="wrap"><header class="hero"><div class="brand"><a class="brand-link" href="/" aria-label="'+esc(S.shop.name)+' home"><h1 class="logo">'+esc(S.shop.name)+'</h1><span class="by">'+esc(S.shop.by)+'</span></a></div>'+(!selected?'<div class="hero-message"><p class="sub">'+esc(S.shop.tagline)+'</p><p class="hero-copy">Browse the picks, then message us on Discord to order.</p>'+(S.shop.discordUrl?'<a class="discord-link" href="'+esc(S.shop.discordUrl)+'" target="_blank" rel="noopener noreferrer">Join us on Discord <span aria-hidden="true">↗</span></a>':'')+'</div>':'')+'</header>';
  if(S.admin) h += '<div class="bar"><b>✦ Admin mode</b><button class="btn pri" data-a="add">+ Add product</button><button class="btn" data-a="addcat">+ Add category</button><button class="btn" data-a="managecats">Manage categories</button><button class="btn" data-a="logout">Log out</button></div>';
  h += '<main>';
  if(S.loading){
    h += '<div class="state-panel loading" role="status">Loading the catalog…</div>';
  }else if(S.loadError){
    h += '<section class="state-panel" role="alert"><h2>We couldn’t load the catalog</h2><p>Please check your connection and try again.</p><button class="btn pri" data-a="retry">Try again</button></section>';
  }else if(selected){
    h += '<button class="btn back" data-a="back">← Back to catalog</button>';
    h += '<section class="product-detail"><div class="detail-art"><span class="art-fallback" aria-hidden="true">✦</span>'+(selected.imageUrl?'<img class="product-image" src="'+esc(selected.imageUrl)+'" alt="'+esc(selected.name)+'" decoding="async">':'')+'</div><div class="detail-info"><div class="cat">'+esc(selected.category||'Other')+'</div><h2>'+esc(selected.name)+'</h2><p class="note">'+denominations.length+' package option'+(denominations.length===1?'':'s')+'</p>'+(S.admin?'<div class="acts"><button class="btn pri" data-a="adddenom">+ Add denomination</button><button class="btn" data-a="editproduct" data-id="'+esc(selected.id)+'">Edit product</button><button class="btn del" data-a="deleteproduct" data-id="'+esc(selected.id)+'">Delete product</button></div>':'')+'<h2 class="denom-title">Prices &amp; availability</h2><div class="denomination-list">'+(denominations.length?denominations.map(p=>
      '<div class="denomination-wrap"><div class="denomination"><span><span class="denom-name">'+esc(p.name)+'</span>'+(p.note?'<span class="denom-note" style="display:block">'+esc(p.note)+'</span>':'')+'<span class="badge '+(p.available?'y':'n')+'">'+(p.available?'Available':'Out of stock')+'</span></span><span class="denom-price">'+peso(p.price)+'</span></div>'+(S.admin?'<div class="acts"><button class="btn" data-a="togdenom" data-product-id="'+esc(selected.id)+'" data-id="'+esc(p.id)+'">'+(p.available?'Mark out':'Mark available')+'</button><button class="btn" data-a="editdenom" data-product-id="'+esc(selected.id)+'" data-id="'+esc(p.id)+'">Edit</button><button class="btn del" data-a="deleteddenom" data-product-id="'+esc(selected.id)+'" data-id="'+esc(p.id)+'">Delete</button></div>':'')+'</div>'
    ).join(''):'<p class="note">No denominations have been added yet.</p>')+'</div></div></section>';
  }else{
    h += '<section class="catalog-intro"><div><h2 class="catalog-title">Find your top-up</h2><p class="catalog-help">Choose a game to see its products, prices, and availability.</p></div><div class="search-wrap"><input class="search" id="q" type="search" aria-label="Search products" placeholder="Search games or products" value="'+esc(S.q)+'"></div></section>';
    h += '<nav class="tabs" aria-label="Filter products by category">'+cats.map(c=>'<button class="tab'+(c===S.cat?' on':'')+'" data-cat="'+esc(c)+'" aria-pressed="'+(c===S.cat)+'">'+esc(c)+'</button>').join('')+'</nav>';
    if(!list.length) h += '<section class="empty"><h3>No matching products</h3><p>Try another search or clear your filters.</p><button class="btn" data-a="clearfilters">Clear search and filters</button></section>';
    h += '<div class="grid">'+list.map(p=>{
      const lowest=p.denominations.length?Math.min(...p.denominations.map(d=>Number(d.price))):null;
      return '<div class="card"><a class="product-open" href="/product?id='+encodeURIComponent(p.id)+'" data-product-link="'+esc(p.id)+'" aria-label="View prices and details for '+esc(p.name)+'"><div class="product-art"><span class="art-fallback" aria-hidden="true">✦</span>'+(p.imageUrl?'<img class="product-image" src="'+esc(p.imageUrl)+'" alt="" loading="lazy" decoding="async">':'')+'</div><div class="cat">'+esc(p.category||'Other')+'</div><div class="name">'+esc(p.name)+'</div><div class="note">'+p.denominations.length+' option'+(p.denominations.length===1?'':'s')+'</div>'+
      '<div class="row"><span class="price">'+(lowest===null?'No prices yet':'From '+peso(lowest))+'</span><span class="card-cta">View prices <span aria-hidden="true">→</span></span></div>'+
      '</a>'+(S.admin?'<div class="acts"><button class="btn" data-a="editproduct" data-id="'+esc(p.id)+'">Edit product</button><button class="btn del" data-a="deleteproduct" data-id="'+esc(p.id)+'">Delete</button></div>':'')+
      '</div>';
    }).join('')+'</div>';
  }
  h += '</main><footer><span>✦ '+esc(S.shop.name)+' '+esc(S.shop.by)+' ✦</span><a class="admin-link" href="/admin">Store admin</a></footer></div>';
  if(S.login) h += '<div class="modal"><div class="box"><h3>Admin login</h3><div class="f"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div><div class="acts"><button class="btn pri" data-a="dologin">Log in</button><button class="btn" data-a="closelogin">Cancel</button></div></div></div>';
  if(S.modal) h += modalHtml(S.modal);
  const keep = document.activeElement && document.activeElement.id==='q';
  $('root').innerHTML = h;
  $('root').querySelectorAll('.product-image').forEach(img=>img.addEventListener('error',()=>img.remove()));
  if(keep){const i=$('q');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
  if(S.login) $('pw').focus();
}
function navigateProduct(id){
  history.pushState({productId:id},'','/product?id='+encodeURIComponent(id));
  render(); window.scrollTo(0,0);
}
function navigateHome(){
  history.pushState({},'','/');
  render(); window.scrollTo(0,0);
}
function modalHtml(m){
  if(m.type==='category') return '<div class="modal"><div class="box"><h3>Add category</h3><div class="f"><label for="m_category">Category name</label><input id="m_category" maxlength="50" placeholder="e.g. Mobile Games"></div><div class="acts"><button class="btn pri" data-a="savecat">Add category</button><button class="btn" data-a="cancel">Cancel</button></div></div></div>';
  if(m.type==='manageCategories') return '<div class="modal"><div class="box"><h3>Manage categories</h3>'+(S.categories.length?S.categories.map(c=>'<div class="category-row"><span class="category-name">'+esc(c)+'</span><span class="acts"><button class="btn" data-a="renamecat" data-category="'+esc(c)+'">Rename</button><button class="btn del" data-a="deletecat" data-category="'+esc(c)+'">Delete</button></span></div>').join(''):'<p class="note">No categories yet.</p>')+'<div class="acts"><button class="btn" data-a="cancel">Done</button></div></div></div>';
  if(m.type==='editCategory') return '<div class="modal"><div class="box"><h3>Rename category</h3><div class="f"><label for="m_category">Category name</label><input id="m_category" maxlength="50" value="'+esc(m.category)+'"></div><div class="acts"><button class="btn pri" data-a="savecatname">Save</button><button class="btn" data-a="managecats">Cancel</button></div></div></div>';
  const p=m.p, cats=[...new Set([...S.categories,...S.products.map(x=>x.category).filter(Boolean)])];
  if(m.type==='denomination') return '<div class="modal"><div class="box"><h3>'+(m.isNew?'Add denomination':'Edit denomination')+'</h3>'+
  '<div class="f"><label for="m_name">Package name</label><input id="m_name" maxlength="100" value="'+esc(p.name||'')+'" placeholder="e.g. 100 diamonds"></div>'+
  '<div class="f"><label for="m_price">Price (₱)</label><input id="m_price" type="number" min="0" step="any" value="'+esc(p.price??'')+'"></div>'+
  '<div class="f"><label for="m_note">Note (optional)</label><input id="m_note" value="'+esc(p.note||'')+'"></div>'+
  '<label class="chk"><input type="checkbox" id="m_av"'+(p.available!==false?' checked':'')+' style="width:auto"> Available</label>'+
  '<div class="acts"><button class="btn pri" data-a="savedenom">Save</button><button class="btn" data-a="cancel">Cancel</button></div></div></div>';
  return '<div class="modal"><div class="box"><h3>'+(m.isNew?'Add product':'Edit product')+'</h3>'+
  '<div class="f"><label for="m_name">Product name</label><input id="m_name" maxlength="100" value="'+esc(p.name||'')+'" placeholder="e.g. MLBB Diamonds"></div>'+
  '<div class="f"><label for="m_cat">Category</label><input id="m_cat" list="cl" maxlength="50" value="'+esc(p.category||'')+'" placeholder="e.g. MLBB"><datalist id="cl">'+cats.map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist></div>'+
  '<div class="f"><label for="m_image">Product image URL (optional)</label><input id="m_image" type="url" inputmode="url" placeholder="https://…" value="'+esc(p.imageUrl||'')+'"><small>Use a direct HTTPS image link. The image is displayed publicly.</small></div>'+
  '<div class="acts"><button class="btn pri" data-a="ok">Save</button><button class="btn" data-a="cancel">Cancel</button></div></div></div>';
}
async function doLogin(){
  try{await api('POST','/api/login',{password:$('pw').value});S.admin=true;S.login=false;if(location.pathname==='/admin')history.replaceState(null,'','/');render()}
  catch(e){toast(e.message)}
}
document.addEventListener('click', async e=>{
  const link=e.target.closest('a[data-product-link]');
  if(link){e.preventDefault();navigateProduct(link.dataset.productLink);return}
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.cat!==undefined){S.cat=t.dataset.cat;render();return}
  const a=t.dataset.a, id=t.dataset.id, p=S.products.find(x=>x.id===id), category=t.dataset.category, productId=t.dataset.productId;
  try{
    if(a==='clearfilters'){S.q='';S.cat='All';render()}
    else if(a==='retry') loadData();
    else if(a==='add'){S.modal={type:'product',isNew:true,p:{name:'',category:S.cat==='All'?'':S.cat,imageUrl:''}};render()}
    else if(a==='adddenom'){
      const currentId=location.pathname==='/product'?new URLSearchParams(location.search).get('id'):null, currentProduct=S.products.find(x=>x.id===currentId);
      if(currentProduct) S.modal={type:'denomination',isNew:true,productId:currentProduct.id,p:{name:'',price:'',note:'',available:true}};
      render();
    }
    else if(a==='addcat'){S.modal={type:'category'};render()}
    else if(a==='managecats'){S.modal={type:'manageCategories'};render()}
    else if(a==='savecat'){
      const category=$('m_category').value.trim(), d=await api('POST','/api/categories',{category});
      S.modal=null;S.cat=category;setData(d);toast('Category added');
    }
    else if(a==='renamecat'){S.modal={type:'editCategory',category};render()}
    else if(a==='savecatname'){
      const oldCategory=S.modal.category, category=$('m_category').value.trim(), d=await api('PUT','/api/categories',{oldCategory,category});
      if(S.cat===oldCategory) S.cat=category;
      S.modal={type:'manageCategories'};setData(d);toast('Category renamed');
    }
    else if(a==='deletecat'){
      const count=S.products.filter(x=>x.category===category).length;
      if(confirm('Delete category "'+category+'"?'+(count?` ${count} product${count===1?' will':'s will'} be left uncategorized.`:''))){
        const d=await api('DELETE','/api/categories',{category});
        if(S.cat===category) S.cat='All';
        S.modal={type:'manageCategories'};setData(d);toast('Category deleted');
      }
    }
    else if(a==='back'){navigateHome()}
    else if(a==='editproduct'){if(p) S.modal={type:'product',isNew:false,p:{...p}};render()}
    else if(a==='deleteproduct'){
      if(p&&confirm('Delete product "'+p.name+'" and all '+p.denominations.length+' denomination(s)?')){setData(await api('DELETE','/api/products/'+id));navigateHome()}
    }
    else if(a==='editdenom'||a==='togdenom'||a==='deleteddenom'){
      const owner=S.products.find(x=>x.id===productId), denomination=owner?.denominations.find(x=>x.id===id);
      if(!owner||!denomination) throw new Error('Denomination not found');
      const endpoint='/api/products/'+productId+'/denominations/'+id;
      if(a==='editdenom'){S.modal={type:'denomination',isNew:false,productId,p:{...denomination}};render()}
      else if(a==='togdenom') setData(await api('PUT',endpoint,{...denomination,available:!denomination.available}));
      else if(confirm('Delete denomination "'+denomination.name+'"?')) setData(await api('DELETE',endpoint,{}));
    }
    else if(a==='cancel'){S.modal=null;render()}
    else if(a==='ok'){
      const v={name:$('m_name').value,category:$('m_cat').value,imageUrl:$('m_image').value};
      const isNew=S.modal.isNew, d=isNew?await api('POST','/api/products',v):await api('PUT','/api/products/'+S.modal.p.id,v);
      const created=isNew?d.products[d.products.length-1]:null;
      S.modal=null;setData(d);if(created) navigateProduct(created.id);
    }
    else if(a==='savedenom'){
      const v={name:$('m_name').value,price:$('m_price').value,note:$('m_note').value,available:$('m_av').checked};
      const endpoint='/api/products/'+S.modal.productId+'/denominations', d=S.modal.isNew?await api('POST',endpoint,v):await api('PUT',endpoint+'/'+S.modal.p.id,v);
      S.modal=null;setData(d);
    }
    else if(a==='dologin') doLogin();
    else if(a==='closelogin'){S.login=false;render()}
    else if(a==='logout'){await api('POST','/api/logout');S.admin=false;render()}
  }catch(err){toast(err.message)}
});
document.addEventListener('input', e=>{ if(e.target.id==='q'){S.q=e.target.value;render()} });
document.addEventListener('keydown', e=>{
  if(e.key==='Enter'&&e.target.id==='pw') doLogin();
});
addEventListener('popstate',render);

// starry sky
(function(){
  const c=$('sky'),x=c.getContext('2d');let w,h,stars=[];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){w=c.width=innerWidth;h=c.height=innerHeight;stars=Array.from({length:Math.min(140,Math.floor(w*h/9000))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.3,p:Math.random()*6.28,s:Math.random()*.02+.005,g:Math.random()<.18}))}
  function star(px,py,r){x.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,d=i%2?r*.45:r;x.lineTo(px+Math.cos(a)*d,py+Math.sin(a)*d)}x.closePath();x.fill()}
  function draw(){x.clearRect(0,0,w,h);for(const s of stars){s.p+=s.s;const o=.45+.55*Math.abs(Math.sin(s.p));x.globalAlpha=o;x.fillStyle=s.g?'#ffd84d':'#f3e8ff';if(s.g)star(s.x,s.y,s.r*3.2);else{x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()}}x.globalAlpha=1;if(!reduce)requestAnimationFrame(draw)}
  addEventListener('resize',size);size();draw();
})();

async function loadData(){
  S.loading=true;S.loadError='';render();
  try{
    const [d,me]=await Promise.all([api('GET','/api/products'),api('GET','/api/me')]);
    S.admin=me.admin; S.shop=d.shop; S.products=d.products; S.categories=d.categories||[];S.loading=false;
    if(location.pathname==='/admin'&&!S.admin) S.login=true;
    render();
  }catch(e){S.loading=false;S.loadError=e.message;render()}
}
render();
loadData();
</script>
